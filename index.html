<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#182a48" />
    <meta name="description" content="中考道法易混易错知识点离线刷题训练场。" />
    <title>易混易错 · 道法刷题本</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="site-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark">道</div>
          <div>
            <div class="brand-name">易混易错 · 刷题本</div>
            <div class="brand-sub">中考道法知识点训练场 · 离线版</div>
          </div>
        </div>
        <div class="top-stats" aria-live="polite">
          <span><b id="bank-count">309</b> 道题库</span>
          <span><b id="accuracy">0%</b> 正确率</span>
          <span class="streak">✦ <b id="streak">0</b> 连对</span>
        </div>
      </header>

      <div class="content-grid">
        <aside class="side-panel">
          <div class="eyebrow">TODAY'S PRACTICE</div>
          <h1>把易错点，<br /><em>练成肌肉记忆。</em></h1>
          <p class="side-copy">每次只攻克一个知识点。选择模式、挖空方向都可以随时切换。</p>

          <div class="goal-card">
            <div class="goal-label"><span>今日进度</span><b><span id="today-count">0</span> / 20</b></div>
            <div class="progress-track"><div id="progress-bar" style="width:0%"></div></div>
            <small id="goal-message">再答 20 题完成今日目标</small>
          </div>

          <div class="control-block">
            <label for="category-select">选择栏目</label>
            <select id="category-select"></select>
          </div>

          <div class="control-block">
            <label>出题模式</label>
            <div class="segmented" role="group" aria-label="出题模式">
              <button type="button" id="fill-mode">填空题</button>
              <button type="button" id="choice-mode">选择题</button>
            </div>
          </div>

          <div class="control-block">
            <label>挖空对象</label>
            <div class="direction-buttons" role="group" aria-label="挖空对象">
              <button type="button" id="answer-side"><span class="dot red"></span>挖答案</button>
              <button type="button" id="keyword-side"><span class="dot navy"></span>挖关键词</button>
            </div>
          </div>

          <div class="side-foot">
            <span class="mini-seal">背</span>
            <span>背诵版与默写版<br />知识点已全部收录</span>
            <button type="button" class="clear-progress" id="clear-progress">清空进度</button>
          </div>
        </aside>

        <section class="practice-panel" aria-live="polite">
          <div class="practice-head">
            <div>
              <div class="question-count">第 <span id="question-id">1</span> 题 <span>/ <span id="question-total">309</span></span></div>
              <div class="category-tag" id="question-category"></div>
            </div>
            <button type="button" class="shuffle-btn" id="shuffle-question">↝ 随机换一题</button>
          </div>

          <div class="question-card">
            <div class="card-kicker">知识点填空 <span>· <span id="blank-label">答案</span></span></div>
            <h2 id="question-prompt"></h2>
            <div class="source-line">原知识点：<span id="source-text"></span></div>
          </div>

          <div id="answer-view"></div>

          <div class="bottom-actions">
            <span class="hint" id="hint">提示：关键词顺序正确即可得分</span>
            <button type="button" class="next-btn" id="next-question">下一题 <span>→</span></button>
          </div>
        </section>
      </div>

      <footer class="site-footer">
        <span>中考道法 · 易混易错知识点</span>
        <span>认真刷题，稳稳上岸 <i>♥</i></span>
      </footer>
    </main>

    <script src="questions.js"></script>
    <script src="app.js"></script>
  </body>
</html>
