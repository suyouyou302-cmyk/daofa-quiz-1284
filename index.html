<!doctype html>

<style>

var(--muted);font-size:11px;font-weight:700;margin-bottom:8px;letter-spacing:.07em}.control select{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:10px 11px;outline:0}.seg{display:grid;grid-template-columns:1fr 1fr;background:#ebe8e1;padding:3px;border-radius:9px}.seg button,.dirs button{border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:7px;font-size:12px}.seg button.active{background:var(--paper);color:var(--ink);box-shadow:0 1px 5px #d9d6ce;font-weight:700}.dirs{display:flex;gap:8px}.dirs button{flex:1;border:1px solid var(--line);font-size:11px;text-align:left}.dirs button.active{color:var(--ink);background:var(--paper);border-color:#d5d0c6;font-weight:700}.dot{width:7px;height:7px;display:inline-block;border-radius:50%;margin-right:5px}.red{background:var(--red)}.navy{background:var(--ink)}.footnote{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;line-height:1.55;margin-top:36px}.mini{width:28px;height:28px;border:1px solid #dbbeb9;border-radius:50%;color:var(--red);display:grid;place-items:center;font-weight:800}.clear{margin-left:auto;border:0;background:transparent;color:#a7a8a8;font-size:10px;padding:3px 0}.clear:hover{color:var(--red)}.practice{min-width:0;padding-top:13px}.practice-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.count{font-weight:800;font-size:15px}.count span{color:#afb5be;font-weight:500}.tag{color:var(--red);font-size:11px;margin-top:7px}.shuffle{border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px 0}.shuffle:hover{color:var(--red)}.card{background:var(--ink);border-radius:15px;min-height:214px;padding:28px 31px 23px;color:#fff;position:relative;overflow:hidden;box-shadow:0 13px 32px #182a4824}.card:after{content:"道";position:absolute;right:23px;bottom:-25px;font-family:Georgia,serif;font-size:150px;font-weight:700;color:#ffffff0b;pointer-events:none}.kicker{position:relative;z-index:1;color:#ecb8af;font-size:11px;letter-spacing:.08em}.kicker span{color:#b9c5d6}.card h2{position:relative;z-index:1;max-width:780px;font-size:clamp(22px,2.4vw,32px);line-height:1.55;letter-spacing:-.025em;margin:25px 0 21px;overflow-wrap:anywhere}.blank{color:#f1a69e;border-bottom:2px solid #db6a60;padding:0 4px 3px}.source{position:relative;z-index:1;color:#8c9bb0;font-size:11px;line-height:1.6;max-width:90%;overflow-wrap:anywhere}.answer{margin-top:28px}.answer label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:9px}.row{display:flex;gap:10px}.row input{flex:1;min-width:0;border:1px solid #d9d6ce;border-radius:9px;background:var(--paper);color:var(--ink);padding:13px 15px;outline:0}.row input:focus{border-color:#bd8a83;box-shadow:0 0 0 3px #f7e2df}.submit,.next{border:0;border-radius:9px;color:white;background:var(--red);padding:0 20px;font-size:12px;font-weight:700;box-shadow:0 4px 11px #d95b5133}.submit:disabled{opacity:.45;cursor:not-allowed}.choices{margin-top:27px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:57px;text-align:left;border:1px solid #ddd9d0;border-radius:9px;background:var(--paper);color:var(--ink);padding:9px 14px;font-size:13px;overflow-wrap:anywhere}.choice span{width:24px;height:24px;display:inline-grid;place-items:center;margin-right:10px;border-radius:50%;background:#eeeae4;color:var(--muted);font-weight:800;font-size:11px}.choice.selected{border-color:#b9a49f;background:#fff9f4}.choice.good{border-color:#88af99;background:#f0f8f1}.choice.bad{border-color:#d88980;background:#fff1ef}.feedback{display:flex;align-items:flex-start;gap:11px;margin-top:20px;border-radius:10px;padding:13px 15px;font-size:12px}.feedback.good{background:#edf6ef;color:#2f6d45}.feedback.bad{background:#fff0ed;color:#a74740}.feedback .icon{width:23px;height:23px;border-radius:50%;background:currentColor;color:white;display:grid;place-items:center;font-weight:800}.feedback b{font-size:13px}.feedback p{margin:4px 0 0}.bottom{border-top:1px solid var(--line);margin-top:28px;padding-top:19px;display:flex;align-items:center;justify-content:space-between}.hint{color:#9ba3ae;font-size:11px}.next{padding:11px 17px}.next span,.submit span{margin-left:8px;font-size:16px}.footer{max-width:1260px;margin:auto;padding:0 28px 28px;color:#a5a8aa;font-size:10px;display:flex;justify-content:space-between}.footer i{color:var(--red);font-style:normal;margin-left:4px}
@media(max-width:850px){.top{height:auto;padding:18px 20px;align-items:flex-start;gap:15px}.metrics{display:none}.grid{display:block;padding:31px 20px}.side h1{font-size:35px}.copy{max-width:none}.footnote{display:none}.practice{margin-top:37px}.card{padding:23px 20px}.card h2{font-size:22px}.source{max-width:100%}.choices{grid-template-columns:1fr}.row{flex-direction:column}.submit{min-height:45px}.footer{padding:0 20px 22px}}
@media(max-width:600px){.top{padding:14px 16px}.seal{width:34px;height:34px;font-size:19px;border-radius:9px}.brand b{font-size:14px}.brand small{font-size:10px}.grid{padding:26px 16px 24px}.side h1{font-size:32px;margin:13px 0 12px}.copy{font-size:12px;line-height:1.7;margin-bottom:20px}.goal{padding:14px;margin-bottom:22px}.control{margin:16px 0}.practice{margin-top:29px;padding-top:0}.practice-head{align-items:center}.count{font-size:14px}.card{min-height:0;padding:20px 17px 18px;border-radius:13px}.card h2{font-size:20px;line-height:1.65;margin:18px 0 14px}.source{font-size:10px}.answer{margin-top:21px}.row input{padding:12px 13px;font-size:14px}.choices{margin-top:21px;gap:8px}.choice{min-height:52px;padding:8px 11px;font-size:12px}.bottom{margin-top:22px;padding-top:15px}.footer{padding:0 16px 19px;gap:8px;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><div class="seal">道</div><div><b>易混易错 · 刷题本</b><small>中考道法知识点训练场 · 离线版</small></div></div><div class="metrics"><span><b id="totalMetric"></b> 道题库</span><span><b id="accuracyMetric">0%</b> 正确率</span><span class="hot">✦ <b id="streakMetric">0</b> 连对</span></div></header>
<div class="grid"><aside class="side"><div class="eyebrow">TODAY'S PRACTICE</div><h1>把易错点，<br><em>练成肌肉记忆。</em></h1><p class="copy">每次只攻克一个知识点。选择模式、挖空方向都可以随时切换。</p><div class="goal"><div class="goal-title"><span>今日进度</span><b id="goalCount">0 / 20</b></div><div class="track"><i id="goalBar" style="width:0%"></i></div><small id="goalText">再答 20 题完成今日目标</small></div><div class="control"><label>选择栏目</label><select id="categorySelect"></select></div><div class="control"><label>出题模式</label><div class="seg"><button data-mode="fill" class="active">填空题</button><button data-mode="choice">选择题</button></div></div><div class="control"><label>挖空对象</label><div class="dirs"><button data-side="answer" class="active"><span class="dot red"></span>挖答案</button><button data-side="keyword"><span class="dot navy"></span>挖关键词</button></div></div><div class="footnote"><span class="mini">背</span><span>背诵版与默写版<br>知识点已全部收录</span><button id="clearProgress" class="clear">清空进度</button></div></aside>
<section class="practice"><div class="practice-head"><div><div class="count">第 <b id="questionNumber">1</b> 题 <span>/ <b id="questionTotal"></b></span></div><div class="tag" id="categoryTag"></div></div><button id="shuffleButton" class="shuffle">↝ 随机换一题</button></div><div id="questionArea"></div><div class="bottom"><span class="hint" id="hintText">提示：关键词顺序正确即可得分</span><button id="nextButton" class="next">下一题 <span>→</span></button></div></section></div>
<footer class="footer"><span>中考道法 · 易混易错知识点</span><span>认真刷题，稳稳上岸 <i>♥</i></span></footer>
</div>
